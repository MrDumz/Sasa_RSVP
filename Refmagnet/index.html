<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A thank-you keepsake from Samantha's seventh birthday." />
    <title>Samantha's 7th Birthday Thank-You Magnet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Pacifico&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="refmagnet.css" />
  </head>
  <body>
    <main class="magnet" aria-labelledby="magnet-title">
      <div class="pattern" aria-hidden="true"></div>
      <div class="memory-photos" aria-hidden="true">
        <img class="memory-photo memory-photo--left" src="assets/celebrant-memory-1.webp" alt="" />
        <img class="memory-photo memory-photo--right" src="assets/celebrant-memory-2.webp" alt="" />
      </div>
      <img class="background-pup" src="assets/cinnamoroll-playing.png" alt="" aria-hidden="true" />
      <span class="spark spark-one" aria-hidden="true">&#10022;</span>
      <span class="spark spark-two" aria-hidden="true">&#10023;</span>
      <span class="spark spark-three" aria-hidden="true">&#10022;</span>

      <section class="portrait-panel" aria-label="Samantha's birthday portrait">
        <figure class="portrait-frame">
          <img src="assets/samantha-portrait.webp" alt="Samantha wearing a sparkling pink birthday dress" />
        </figure>
        <img class="balloon-character" src="assets/cinnamoroll-balloons-right.png" alt="" aria-hidden="true" />
      </section>

      <section class="magnet-copy">
        <p class="eyebrow">A little keepsake from my magical day</p>
        <h1 id="magnet-title">Samantha</h1>
        <div class="birthday-line">
          <span>celebrated</span>
          <strong>7</strong>
          <span>wonderful<br />years</span>
        </div>

        <div class="keepsake-details" aria-label="Birthday keepsake details">
          <div>
            <small>A day to remember</small>
            <strong>December 5, 2026</strong>
          </div>
        </div>

        <footer class="magnet-footer">
          <div class="signature">
            <p class="closing-copy">Thank you for making my day unforgettable.</p>
            <span>With lots of love,</span>
            <strong>Samantha</strong>
          </div>
        </footer>
      </section>
    </main>
  </body>
</html>
